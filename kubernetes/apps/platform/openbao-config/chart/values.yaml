openbao:
  namespace: openbao
  serviceAccountName: openbao
  address: http://openbao.openbao.svc:8200

configurer:
  name: openbao-configurer
  image: ghcr.io/bank-vaults/bank-vaults:v1.32.1
  replicas: 1

  tokenSecretName: openbao-bank-vaults-token
  tokenSecretKey: vault-root

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi