external-secrets:
  installCRDs: true

  leaderElect: false

  serviceAccount:
    create: true
    name: external-secrets

  rbac:
    create: true
    serviceAccountTokenCreate: true

  log:
    level: info

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  webhook:
    create: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

  certController:
    create: true
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi